<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tsjeng</title>
<meta name="description" content="Het geluid van een bekken.">
<meta name="theme-color" content="#F2C230">
<link rel="icon" href="/bimi-logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&family=Dela+Gothic+One&display=swap">
<style>
  :root {
    --brass: #F2C230;
    --ink: #2A0F14;
    --red: #FF3B1F;

    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);

    --step--1: clamp(0.83rem, 0.78rem + 0.29vw, 1.00rem);
    --step-0:  clamp(1.00rem, 0.91rem + 0.43vw, 1.25rem);
    --space-s: clamp(1.00rem, 0.91rem + 0.43vw, 1.25rem);
    --space-m: clamp(1.50rem, 1.37rem + 0.65vw, 1.88rem);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    background: var(--brass);
    color: var(--ink);
    font-family: 'Bricolage Grotesque', system-ui, sans-serif;
    font-size: var(--step-0);
    line-height: 1.4;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  ::selection { background: var(--ink); color: var(--brass); }

  /* Lathe grooves of a cymbal, centred off-canvas bottom right. */
  .grooves {
    position: fixed;
    inset: 0;
    background: repeating-radial-gradient(circle at 100% 115%, rgba(42,15,20,0.07) 0 1px, transparent 1px 8px);
    pointer-events: none;
  }

  .grooves::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.7' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.5'/%3E%3C/svg%3E");
    opacity: 0.12;
    mix-blend-mode: multiply;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
  }

  main {
    position: relative;
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    grid-template-columns: minmax(0, 1fr);
    padding: var(--space-m);
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: var(--space-s);
  }

  .entry { margin: 0; max-width: 30ch; }
  .entry b { font-weight: 700; }

  .sound {
    flex: none;
    font: inherit;
    font-size: var(--step--1);
    font-weight: 700;
    color: var(--ink);
    background: transparent;
    border: 2px solid var(--ink);
    border-radius: 999px;
    padding: 0.35em 1em;
    cursor: pointer;
    transition: background-color 0.2s var(--ease-out), color 0.2s var(--ease-out), transform 0.15s var(--ease-out);
  }

  @media (hover: hover) {
    .sound:hover { background: var(--ink); color: var(--brass); }
  }

  .sound:active { transform: translateY(2px); }

  .sound:focus-visible, .cymbal:focus-visible {
    outline: 3px solid var(--red);
    outline-offset: 4px;
  }

  .sound[aria-pressed="true"] { background: var(--ink); color: var(--brass); }

  .sound.nudge { animation: nudge 0.6s var(--ease-spring) 2; }

  @keyframes nudge {
    0%, 100% { transform: rotate(0); }
    30% { transform: rotate(-8deg) scale(1.12); }
    60% { transform: rotate(6deg) scale(1.06); }
  }

  .cymbal {
    display: flex;
    align-items: flex-end;
    min-height: 0;
    min-width: 0;
    width: 100%;
    padding: 0;
    margin: 0;
    border: 0;
    background: none;
    color: inherit;
    text-align: left;
    cursor: pointer;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }

  .word {
    display: inline-block;
    font-family: 'Dela Gothic One', sans-serif;
    font-size: 20vw;
    line-height: 0.82;
    padding-bottom: 0.26em;
    letter-spacing: -0.03em;
    white-space: nowrap;
  }

  .word span {
    position: relative;
    display: inline-block;
    isolation: isolate;
    transition: transform 0.9s var(--ease-spring);
  }

  /* Second print colour: a red halftone copy of each letter, slightly off-register. */
  .word span::before {
    content: attr(data-ch);
    position: absolute;
    left: 0;
    top: -0.3em;
    padding: 0.3em 0;
    z-index: -1;
    color: transparent;
    background: radial-gradient(circle, var(--red) 42%, transparent 46%) 0 0 / 0.045em 0.045em;
    -webkit-background-clip: text;
    background-clip: text;
    translate: 0.05em 0.045em;
    transition: translate 0.9s var(--ease-spring);
  }

  .word.struck span { transition: transform 0.06s var(--ease-out); }

  .word.struck span::before {
    translate: 0.11em 0.08em;
    transition: translate 0.06s var(--ease-out);
  }

  .word.enter span {
    animation: drop 0.7s var(--ease-spring) backwards;
    animation-delay: calc(var(--i) * 70ms);
  }

  @keyframes drop {
    from { transform: translateY(-120%) rotate(-12deg); opacity: 0; }
  }

  .holding .word span { animation: buzz 0.07s steps(2) infinite; }

  @keyframes buzz {
    50% { translate: var(--bx, 1px) var(--by, -1px); }
  }

  footer {
    display: flex;
    justify-content: space-between;
    gap: var(--space-s);
    padding-top: var(--space-s);
    font-size: var(--step--1);
  }

  footer p { margin: 0; }

  .flash {
    position: fixed;
    inset: 0;
    background: var(--red);
    opacity: 0;
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  .flash.on { animation: flash 0.28s var(--ease-out); }

  @keyframes flash {
    from { opacity: 0.55; }
    to { opacity: 0; }
  }

  .ring {
    position: fixed;
    width: 120px;
    height: 120px;
    margin: -60px 0 0 -60px;
    border: 4px solid var(--ink);
    border-radius: 50%;
    pointer-events: none;
    animation: ring 0.8s var(--ease-out) forwards;
  }

  @keyframes ring {
    from { transform: scale(0.2); opacity: 1; }
    to { transform: scale(6); opacity: 0; border-width: 1px; }
  }

  .confetti {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }

  /* Finale: the cymbal falls off its stand. */
  .word.fall span {
    animation: fall 0.9s cubic-bezier(0.55, 0, 1, 0.45) forwards;
    animation-delay: calc(var(--i) * 25ms);
  }

  @keyframes fall {
    to { transform: translate(var(--fx, 0), 120vh) rotate(var(--fr, 90deg)); }
  }

  @media (orientation: portrait) {
    .cymbal { align-items: center; }
  }

  @media (prefers-reduced-motion: reduce) {
    .word span, .word.struck span, .word span::before, .word.struck span::before { transition: none; }
    .word.enter span, .word.fall span, .holding .word span, .sound.nudge, .flash.on { animation: none; }
    .ring { display: none; }
  }
</style>
</head>
<body>
  <div class="grooves" aria-hidden="true"></div>
  <main>
    <header>
      <p class="entry"><b>tsjeng</b> <i>tussenwerpsel</i><br>Het geluid van een bekken. Ook te gebruiken als iets net gelukt is.</p>
      <button class="sound" type="button" aria-pressed="true">geluid aan</button>
    </header>

    <h1 class="sr-only">tsjeng</h1>
    <button class="cymbal" type="button" aria-label="Sla op het bekken. Houd vast voor een langere tsjeng.">
      <span class="word enter" aria-hidden="true"></span>
    </button>

    <footer>
      <p class="hint">Klik op het woord. Houd vast voor een langere tsjeng.</p>
      <p>tsjeng.nl</p>
    </footer>
  </main>
  <div class="flash" aria-hidden="true"></div>

<script>
const MAX_E = 24;
const GROW_DELAY_MS = 220;
const GROW_EVERY_MS = 110;
const SHRINK_EVERY_MS = 35;

const cymbalEl = document.querySelector('.cymbal');
const wordEl = document.querySelector('.word');
const soundBtn = document.querySelector('.sound');
const flashEl = document.querySelector('.flash');
const hintEl = document.querySelector('.hint');
const HINT = hintEl.textContent;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

const rand = (min, max) => min + Math.random() * (max - min);

// --- word -----------------------------------------------------------------

function letterSpan(ch, i) {
  const s = document.createElement('span');
  s.textContent = ch;
  s.dataset.ch = ch;
  s.style.setProperty('--i', i);
  s.style.setProperty('--bx', `${rand(-2, 2).toFixed(1)}px`);
  s.style.setProperty('--by', `${rand(-2, 2).toFixed(1)}px`);
  return s;
}

'tsjeng'.split('').forEach((ch, i) => wordEl.appendChild(letterSpan(ch, i)));
const nSpan = wordEl.children[4];
let eCount = 1;

// Size the word to fill the width, leaving a little slack for jolted letters.
const FIT_SLACK = 0.97;
const LINE_BOX = 0.82 + 0.26;

function fit() {
  wordEl.style.fontSize = '100px';
  const w = wordEl.getBoundingClientRect().width;
  const size = Math.min(100 * FIT_SLACK * cymbalEl.clientWidth / w, cymbalEl.clientHeight / LINE_BOX);
  wordEl.style.fontSize = `${size}px`;
}

function jolt(span) {
  if (reduceMotion.matches) return;
  span.style.transform = `translate(${rand(-0.05, 0.05)}em, ${rand(-0.14, 0.03)}em) rotate(${rand(-14, 14)}deg)`;
}

function addE() {
  const e = letterSpan('e', 0);
  wordEl.insertBefore(e, nSpan);
  eCount++;
  fit();
  jolt(e);
}

function removeE() {
  nSpan.previousElementSibling.remove();
  eCount--;
  fit();
}

// --- sound ----------------------------------------------------------------

// Crash cymbal, 808-style: inharmonic square waves plus looping noise, band- and high-passed.
const CYMBAL_FREQS = [205.3, 304.4, 369.6, 522.7, 540, 800];
let audioCtx = null;
let noiseBuffer = null;
let voice = null;
let soundOn = true;
try { soundOn = localStorage.getItem('tsjeng-sound') !== 'off'; } catch {}

function strike(pitch = rand(0.9, 1.2)) {
  if (!soundOn) return null;
  audioCtx ??= new (window.AudioContext || window.webkitAudioContext)();
  if (!noiseBuffer) {
    noiseBuffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 2, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }
  const t = audioCtx.currentTime;

  const env = audioCtx.createGain();
  env.gain.setValueAtTime(0.0001, t);
  env.gain.exponentialRampToValueAtTime(0.5, t + 0.004);
  env.gain.exponentialRampToValueAtTime(0.16, t + 0.25);
  env.connect(audioCtx.destination);

  const highpass = audioCtx.createBiquadFilter();
  highpass.type = 'highpass';
  highpass.frequency.value = 5000 * pitch;
  highpass.connect(env);

  const bandpass = audioCtx.createBiquadFilter();
  bandpass.type = 'bandpass';
  bandpass.frequency.value = 9000 * pitch;
  bandpass.Q.value = 0.6;
  bandpass.connect(highpass);

  const sources = CYMBAL_FREQS.map(f => {
    const osc = audioCtx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = f * pitch;
    const g = audioCtx.createGain();
    g.gain.value = 0.12;
    osc.connect(g).connect(bandpass);
    return osc;
  });

  const noise = audioCtx.createBufferSource();
  noise.buffer = noiseBuffer;
  noise.loop = true;
  const ng = audioCtx.createGain();
  ng.gain.value = 0.6;
  noise.connect(ng).connect(highpass);
  sources.push(noise);

  sources.forEach(s => s.start(t));
  return { env, sources };
}

function letRing(v) {
  if (!v) return;
  const t = audioCtx.currentTime;
  v.env.gain.cancelScheduledValues(t);
  v.env.gain.setValueAtTime(Math.max(v.env.gain.value, 0.0001), t);
  v.env.gain.exponentialRampToValueAtTime(0.0001, t + 1.4);
  v.sources.forEach(s => s.stop(t + 1.5));
}

// Applause: a few hundred short noise bursts in one buffer, swelling then fading out.
const APPLAUSE_SECONDS = 3;
const APPLAUSE_CLAPS = 420;
let applauseBuffer = null;

function playApplause() {
  if (!soundOn) return;
  if (!applauseBuffer) {
    const sr = audioCtx.sampleRate;
    applauseBuffer = audioCtx.createBuffer(1, sr * APPLAUSE_SECONDS, sr);
    const data = applauseBuffer.getChannelData(0);
    const clapLen = Math.floor(sr * 0.06);
    for (let n = 0; n < APPLAUSE_CLAPS; n++) {
      // Dense near the start, thinning towards the end.
      const start = Math.floor(Math.pow(Math.random(), 1.6) * (data.length - clapLen));
      const amp = rand(0.15, 0.5) * (1 - start / data.length);
      const tau = sr * rand(0.006, 0.014);
      for (let i = 0; i < clapLen; i++) {
        data[start + i] += (Math.random() * 2 - 1) * amp * Math.exp(-i / tau);
      }
    }
    let peak = 0;
    for (let i = 0; i < data.length; i++) peak = Math.max(peak, Math.abs(data[i]));
    for (let i = 0; i < data.length; i++) data[i] *= 0.9 / peak;
  }
  const t = audioCtx.currentTime;
  const src = audioCtx.createBufferSource();
  src.buffer = applauseBuffer;
  const bandpass = audioCtx.createBiquadFilter();
  bandpass.type = 'bandpass';
  bandpass.frequency.value = 1400;
  bandpass.Q.value = 0.5;
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.5, t + 0.25);
  src.connect(bandpass).connect(g).connect(audioCtx.destination);
  src.start(t + 0.15);
}

function syncSound() {
  soundBtn.textContent = soundOn ? 'geluid aan' : 'geluid uit';
  soundBtn.setAttribute('aria-pressed', String(soundOn));
}

soundBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  try { localStorage.setItem('tsjeng-sound', soundOn ? 'on' : 'off'); } catch {}
  soundBtn.classList.remove('nudge');
  syncSound();
});
syncSound();

// --- interaction ----------------------------------------------------------

let holding = false;
let growDelay = null;
let growTimer = null;
let shrinkTimer = null;
let nudged = false;
let fallen = false;
const FINALE_RESET_MS = 1400;

function spawnRing(x, y) {
  if (reduceMotion.matches) return;
  const ring = document.createElement('div');
  ring.className = 'ring';
  ring.style.left = `${x}px`;
  ring.style.top = `${y}px`;
  ring.addEventListener('animationend', () => ring.remove());
  document.body.appendChild(ring);
}

function press(x, y) {
  if (holding || fallen) return;
  holding = true;
  clearInterval(shrinkTimer);
  wordEl.classList.remove('enter');
  hintEl.textContent = HINT;

  voice = strike();
  if (!soundOn && !nudged) {
    nudged = true;
    soundBtn.classList.add('nudge');
  }

  wordEl.classList.add('struck');
  [...wordEl.children].forEach(jolt);
  flash();
  spawnRing(x, y);
  document.body.classList.add('holding');

  growDelay = setTimeout(() => {
    growTimer = setInterval(() => {
      if (eCount < MAX_E) addE();
      else finale();
    }, GROW_EVERY_MS);
  }, GROW_DELAY_MS);
}

function flash() {
  flashEl.classList.remove('on');
  flashEl.offsetWidth;
  flashEl.classList.add('on');
}

// Confetti from two cannons in the bottom corners, in the page palette plus the logo's teal.
const CONFETTI_COLORS = ['#FF3B1F', '#2A0F14', '#FFF6DA', '#05A89D'];
const CONFETTI_PER_CANNON = 90;
const CONFETTI_MS = 4200;

function launchConfetti() {
  if (reduceMotion.matches) return;
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti';
  canvas.setAttribute('aria-hidden', 'true');
  document.body.appendChild(canvas);
  const dpr = window.devicePixelRatio || 1;
  const w = innerWidth;
  const h = innerHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  const GRAVITY = 0.25;
  const MAX_FALL = 3;
  // Launch speed to reach near the top of the screen, padded for drag.
  const power = Math.sqrt(2 * GRAVITY * 0.9 * h) * 1.4;
  const pieces = [];
  for (const side of [-1, 1]) {
    for (let n = 0; n < CONFETTI_PER_CANNON; n++) {
      const angle = rand(48, 84) * Math.PI / 180;
      const speed = rand(0.7, 1.05) * power;
      pieces.push({
        x: side < 0 ? 0 : w,
        y: h,
        vx: -side * Math.cos(angle) * speed,
        vy: -Math.sin(angle) * speed,
        w: rand(7, 13),
        h: rand(4, 7),
        rot: rand(0, Math.PI * 2),
        vr: rand(-0.3, 0.3),
        flutter: rand(0, Math.PI * 2),
        color: CONFETTI_COLORS[n % CONFETTI_COLORS.length],
      });
    }
  }

  const start = performance.now();
  let last = start;
  function frame(now) {
    const dt = Math.min((now - last) / 16.67, 3);
    last = now;
    ctx.clearRect(0, 0, w, h);
    for (const p of pieces) {
      p.vy = Math.min(p.vy + GRAVITY * dt, MAX_FALL);
      p.vx *= Math.pow(0.985, dt);
      p.vy *= Math.pow(0.985, dt);
      p.x += (p.vx + Math.sin(p.flutter) * 1.2) * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.flutter += 0.12 * dt;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.scale(1, Math.cos(p.flutter));
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (now - start < CONFETTI_MS) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  // Timer, not rAF, so the canvas also goes away when the tab was in the background.
  setTimeout(() => canvas.remove(), CONFETTI_MS);
}

function finale() {
  holding = false;
  fallen = true;
  clearTimeout(growDelay);
  clearInterval(growTimer);
  document.body.classList.remove('holding');

  letRing(voice);
  voice = null;
  letRing(strike(0.7));
  playApplause();
  launchConfetti();

  flash();
  setTimeout(flash, 160);
  const r = wordEl.getBoundingClientRect();
  spawnRing(r.left + r.width / 2, r.top + r.height / 2);
  hintEl.textContent = 'Applaus! Het bekken is wel van de standaard gevallen.';

  wordEl.classList.remove('struck');
  [...wordEl.children].forEach((s, i) => {
    s.style.setProperty('--i', i);
    s.style.setProperty('--fx', `${rand(-30, 30).toFixed(0)}vw`);
    s.style.setProperty('--fr', `${rand(-200, 200).toFixed(0)}deg`);
  });
  wordEl.classList.add('fall');

  setTimeout(() => {
    while (eCount > 1) removeE();
    [...wordEl.children].forEach((s, i) => {
      s.style.transform = '';
      s.style.setProperty('--i', i);
    });
    wordEl.classList.remove('fall');
    wordEl.offsetWidth;
    wordEl.classList.add('enter');
    fallen = false;
  }, reduceMotion.matches ? 0 : FINALE_RESET_MS);
}

function release() {
  if (!holding) return;
  holding = false;
  clearTimeout(growDelay);
  clearInterval(growTimer);
  document.body.classList.remove('holding');

  letRing(voice);
  voice = null;

  wordEl.classList.remove('struck');
  [...wordEl.children].forEach(s => { s.style.transform = ''; });

  shrinkTimer = setInterval(() => {
    if (eCount > 1) removeE();
    else clearInterval(shrinkTimer);
  }, SHRINK_EVERY_MS);
}

cymbalEl.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  cymbalEl.setPointerCapture(e.pointerId);
  press(e.clientX, e.clientY);
});
cymbalEl.addEventListener('pointerup', release);
cymbalEl.addEventListener('pointercancel', release);
cymbalEl.addEventListener('contextmenu', (e) => e.preventDefault());

cymbalEl.addEventListener('keydown', (e) => {
  if (e.key !== ' ' && e.key !== 'Enter') return;
  e.preventDefault();
  if (e.repeat) return;
  const r = wordEl.getBoundingClientRect();
  press(r.left + r.width / 2, r.top + r.height / 2);
});
cymbalEl.addEventListener('keyup', (e) => {
  if (e.key === ' ' || e.key === 'Enter') release();
});

window.addEventListener('resize', fit);
document.fonts.ready.then(fit);
fit();
</script>
</body>
</html>
